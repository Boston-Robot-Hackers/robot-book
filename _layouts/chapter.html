<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Introduction to Robotics</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
  {% assign path_parts = page.path | split: "/" %}
  {% assign collection = path_parts[0] %}

  <header>
    <div class="header-inner">
      <h1><a href="{{ '/' | relative_url }}">Introduction to <span>Robotics</span></a></h1>
    </div>
    <div class="tabs">
      <a class="tab-btn {% if collection == 'claude' %}active{% endif %}"
         href="{{ '/' | relative_url }}#claude">Claude</a>
      <a class="tab-btn {% if collection == 'copilot' %}active{% endif %}"
         href="{{ '/' | relative_url }}#copilot">Copilot</a>
    </div>
  </header>

  <div class="chapter-nav">
    <a href="{{ '/' | relative_url }}">← Back to chapters</a>
  </div>

  <main class="chapter-wrap">
    <h1>{{ page.title }}</h1>
    <div class="chapter-meta">
      {% if page.author %}{{ page.author }}{% endif %}
      {% if page.date %} · {{ page.date | date: "%B %d, %Y" }}{% endif %}
    </div>
    {{ content }}
  </main>

  <script>mermaid.initialize({ startOnLoad: true, theme: 'neutral' });</script>
</body>
</html>
