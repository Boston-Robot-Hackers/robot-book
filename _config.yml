title: Introduction to Robotics
description: A robotics textbook comparing AI-generated drafts
url: "https://boston-robot-hackers.github.io"
baseurl: "/robot-book"

permalink: pretty

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: "claude"
    values:
      layout: chapter
  - scope:
      path: "copilot/book"
    values:
      layout: chapter

exclude:
  - CLAUDE.md
  - Gemfile
  - .claude/
  - Gemfile.lock
  - vendor/
  - claude/summary.md
  - claude/outline.md
  - claude/ch04_sensors_overview_outline.md
  - claude/ch05_lidar_outline.md
  - claude/ch06_computer_vision_outline.md
  - copilot/wip/
